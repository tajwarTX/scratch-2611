[package]
name = "pipeline"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pipeline"
path = "src/main.rs"

[dependencies]
memchr = "2"
memmap2 = "0.9"
parquet = { version = "55", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
